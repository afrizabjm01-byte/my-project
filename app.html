<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body align="center">
    <h1>calculator</h1>

    <div>
      <input type="number" id="x" min="0" />
    </div>
    <br />
    <div>
      <input type="number" id="y" min="0" />
    </div>
    <br />
    <div>
      <input type="text" id="f" placeholder="+,-,*,/" />
    </div>
    <br />
    <div>
      <button id="gt" onclick="v()">equel</button>
    </div>
    <br />
    <div>
      <button>
        <p id="out"></p>
      </button>
    </div>
    <br />
    <img src="Chinatsu kano.jpg" height="400" width="400" />

    <script>
      function v() {
        let a = Number(document.getElementById("x").value);
        let b = Number(document.getElementById("y").value);
        let q = document.getElementById("f").value;
        let p;

        if (q == "+") {
          p = a + b;
        } else if (q == "-") {
          p = a - b;
        } else if (q == "*") {
          p = a * b;
        } else if (q == "/") {
          p = a / b;
        } else {
          p = false;
        }
        document.getElementById("out").innerHTML = p;
      }
    </script>
  </body>
</html>
